<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5f3ff" rx="16"/>
  <!-- Screen Frame -->
  <rect x="100" y="40" width="300" height="190" rx="12" fill="#0f172a"/>
  <!-- Screen Display -->
  <rect x="110" y="50" width="280" height="170" rx="6" fill="url(#screenGrad)"/>
  <!-- Graphic inside screen -->
  <path d="M 130 180 L 190 120 L 230 150 L 310 80 L 370 140 L 370 200 L 130 200 Z" fill="url(#laptopGrad)" opacity="0.6"/>
  <circle cx="330" cy="90" r="15" fill="#a78bfa"/>
  <!-- Base -->
  <path d="M 60 235 L 440 235 C 450 235 455 242 450 255 L 430 270 C 425 275 415 275 405 275 L 95 275 C 85 275 75 275 70 270 L 50 255 C 45 242 50 235 60 235 Z" fill="#334155"/>
  <!-- Notch/Trackpad -->
  <rect x="210" y="240" width="80" height="25" rx="4" fill="#475569"/>
  <!-- Text -->
  <text x="250" y="315" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#6d28d9" text-anchor="middle">HIGH-PERFORMANCE LAPTOP</text>
</svg>
