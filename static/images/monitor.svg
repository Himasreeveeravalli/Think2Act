<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="monGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f0f9ff" rx="16"/>
  <!-- Monitor Outer Bezel -->
  <rect x="80" y="40" width="340" height="200" rx="10" fill="#0f172a"/>
  <!-- Screen Display -->
  <rect x="90" y="50" width="320" height="180" rx="4" fill="url(#monGrad)"/>
  <!-- Stand Neck -->
  <rect x="235" y="240" width="30" height="40" fill="#334155"/>
  <!-- Stand Base -->
  <rect x="180" y="275" width="140" height="12" rx="6" fill="#1e293b"/>
  <!-- Screen Graphic Design -->
  <circle cx="200" cy="120" r="35" fill="#ffffff" opacity="0.3"/>
  <rect x="250" y="100" width="120" height="14" rx="7" fill="#ffffff" opacity="0.5"/>
  <rect x="250" y="125" width="90" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
  <!-- Label -->
  <text x="250" y="320" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#0369a1" text-anchor="middle">4K ULTRA HD MONITOR</text>
</svg>
